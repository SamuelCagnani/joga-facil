services:
  court-service:
    build: ./court-service
    ports:
      - "8001:8001"

  match-service:
    build: ./match-service
    ports:
      - "8002:8002"
    environment:
      COURT_SERVICE_URL: http://court-service:8001
    depends_on:
      - court-service

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - court-service
      - match-service